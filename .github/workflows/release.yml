name: Build ARM64 Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA and audio codec build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libogg-dev libvorbis-dev libflac-dev libmpg123-dev pkg-config build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Build librespot (Spotify Connect fallback)
        run: |
          cargo install --git https://github.com/librespot-org/librespot --branch dev --locked --no-default-features --features "alsa-backend,rustls-tls-native-roots,with-libmdns" --root ./dist

      - name: Build go-librespot (Spotify Connect primary)
        run: |
          git clone --depth 1 https://github.com/devgianlu/go-librespot /tmp/go-librespot
          cd /tmp/go-librespot
          git fetch --tags --depth 1 >/dev/null 2>&1 || true
          (git describe --tags --abbrev=0 2>/dev/null || curl -fsSL https://api.github.com/repos/devgianlu/go-librespot/releases/latest | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p') > "${GITHUB_WORKSPACE}/dist/bin/go-librespot.version" || true
          CGO_ENABLED=1 go build -v -o "${GITHUB_WORKSPACE}/dist/bin/go-librespot" ./cmd/daemon

      - name: Build pibuz (Qobuz Connect)
        run: |
          cargo install --git https://github.com/PhilipVinc/pibuz --root ./dist

      - name: Package ARM64 binaries & SHA256 checksum
        run: |
          tar -czvf hydra-sound-arm64-binaries.tar.gz -C ./dist/bin librespot go-librespot go-librespot.version pibuz
          sha256sum hydra-sound-arm64-binaries.tar.gz > hydra-sound-arm64-binaries.tar.gz.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hydra-sound-arm64-binaries.tar.gz
            hydra-sound-arm64-binaries.tar.gz.sha256
          generate_release_notes: true
